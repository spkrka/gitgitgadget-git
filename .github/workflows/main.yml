name: CI

# EXPERIMENT ONLY -- never to be merged.  Base: ps/ci-speedups +
# test-tool-genbytes.  Run the full suite on macOS and Linux with
# identical settings and compare per-script timings to find what
# slowness remains on macOS.

on: [push]

jobs:
  exp:
    name: ${{matrix.jobname}} (${{matrix.os}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - jobname: osx-clang
            cc: clang
            os: macos-15
          - jobname: linux-gcc-default
            cc: gcc
            os: ubuntu-latest
    runs-on: ${{matrix.os}}
    env:
      jobname: ${{matrix.jobname}}
      CC: ${{matrix.cc}}
      CI_JOB_IMAGE: ${{matrix.os}}
      TEST_OUTPUT_DIRECTORY: ${{github.workspace}}/t
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - run: ci/install-dependencies.sh
    - name: machine info
      run: |
        uname -a
        (sysctl -n hw.logicalcpu hw.memsize machdep.cpu.brand_string || nproc) 2>/dev/null
        df -h .
        (httpd -v || apache2 -v) 2>/dev/null || true
    - name: build and test
      run: ci/run-build-and-tests.sh 2>&1 | tee test-output.log
      continue-on-error: true
    - name: per-script timings
      run: |
        grep -E '^\[[0-9:]+\] t[0-9]+-.*\.sh \.+ ' test-output.log |
        perl -ne 'print "$2\t$1\t$3\n" if /(t\d+-\S+\.sh) \.+ ok\s+(\d+) ms .*= +([\d.]+) CPU/' |
        perl -lane 'print join("\t", $F[1], $F[0], $F[2])' |
        sort -k1,1 >timings.tsv
        echo "=== top 40 by wall time (ms, script, cpu s) ==="
        sort -t"	" -k2,2nr timings.tsv | head -40
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: timings-${{matrix.jobname}}
        path: |
          timings.tsv
          test-output.log
