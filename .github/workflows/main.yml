name: CI

# EXPERIMENT ONLY -- never to be merged.  Figure out why
# t5551/t5559 are so slow on macOS.

on: [push]

jobs:
  exp:
    name: ${{matrix.os}} refs=${{matrix.refs}} long=${{matrix.long}}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
        refs: [files, reftable]
        long: ['true', '']
    runs-on: ${{matrix.os}}
    env:
      jobname: ${{ startsWith(matrix.os, 'macos') && 'osx-clang' || 'linux-gcc-default' }}
      CC: ${{ startsWith(matrix.os, 'macos') && 'clang' || 'gcc' }}
      CI_JOB_IMAGE: ${{matrix.os}}
      GIT_TEST_DEFAULT_REF_STORAGE_FORMAT: ${{matrix.refs}}
      GIT_TEST_LONG: ${{matrix.long}}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - run: ci/install-dependencies.sh
    - name: build
      run: make -j8 >/dev/null
    - name: t5551 with per-line timestamps
      run: |
        cd t
        ./t5551-http-fetch-smart.sh -v -x 2>&1 |
        perl -MTime::HiRes=time -ne 'BEGIN{$s=time} printf "%8.2f %s", time-$s, $_' |
        tee ../t5551.log
        echo "=== slowest gaps ==="
        perl -ne '($t)=/^\s*(\S+)/; printf "%7.2f %s", $t-$p, $l if $l && $t-$p > 2; ($p,$l)=($t,$_)' ../t5551.log
        echo "=== ok lines ==="
        grep -E '^ *[0-9.]+ (not )?ok ' ../t5551.log
